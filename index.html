<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" id="metaDescription" content="Florida service areas map">
<meta name="theme-color" id="themeColor" content="#0B63CE">
<meta name="robots" content="index,follow">
<title></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B63CE'/%3E%3Cpath d='M16 7l8 5v7c0 4-3 7-8 8-5-1-8-4-8-8v-7l8-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">
<link rel="dns-prefetch" href="https://basemaps.cartocdn.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#countyInfo">Skip to service area details</a>

<header class="app-header">
  <div class="header-left">
    <div class="logo" id="companyLogo"></div>
  </div>

  <div class="header-center">
    <h1 class="header-title" id="headerTitle"></h1>
    <div class="search">
      <label class="visually-hidden" for="searchCounty" id="searchLabel"></label>
      <input
        id="searchCounty"
        type="search"
        placeholder=""
        autocomplete="off"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="searchSuggestions"
        aria-haspopup="listbox">
      <ul id="searchSuggestions" class="search-suggestions" role="listbox" hidden></ul>
    </div>
  </div>

  <div class="header-right" id="headerStats" role="list" aria-label="Company highlights"></div>
</header>

<main class="container">
  <section class="map-stage" aria-label="Florida service area map">
    <div id="map" role="region" aria-label="Interactive Florida counties map"></div>

    <div class="map-legend" id="mapLegend" aria-label="Map legend">
      <div class="legend-item">
        <span class="legend-swatch legend-swatch-active" aria-hidden="true"></span>
        <span id="legendActive"></span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch legend-swatch-inactive" aria-hidden="true"></span>
        <span id="legendInactive"></span>
      </div>
    </div>

    <div class="map-badge" id="mapBadge">
      <div class="map-badge-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" focusable="false">
          <path d="M12 21s7-5.33 7-11a7 7 0 1 0-14 0c0 5.67 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="10" r="2.4" fill="currentColor"/>
        </svg>
      </div>
      <div class="map-badge-copy">
        <strong id="mapBadgeTitle"></strong>
        <span id="mapBadgeSubtitle"></span>
      </div>
    </div>

    <div class="county-overlay" id="countyOverlay" hidden>
      <button
        type="button"
        class="county-backdrop"
        id="countyBackdrop"
        aria-label="Close county details"></button>

      <aside
        id="sidebar"
        class="county-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="panelTitle">
        <button type="button" class="panel-close" id="panelClose" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>

        <div class="sidebar-header">
          <div class="sidebar-header-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" focusable="false">
              <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <h2 id="panelTitle"></h2>
            <p class="subtitle" id="panelSubtitle"></p>
          </div>
        </div>

        <div id="countyInfo" tabindex="-1"></div>
      </aside>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
